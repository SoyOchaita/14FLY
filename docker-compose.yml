services:
  # ============================================
  # 🗄️  BASE DE DATOS: PostgreSQL (único servicio en Docker para dev)
  # ============================================
  db:
    image: postgres:15
    container_name: fly_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: flydb
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      - db_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d flydb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
