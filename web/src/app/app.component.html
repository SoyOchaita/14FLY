<div class="min-h-screen flex flex-col text-white overflow-x-hidden">
  <!-- Navbar translúcida -->
  <header class="sticky top-0 z-20 bg-dark/80 backdrop-blur-xl border-b border-white/10 shadow-[0_10px_30px_rgba(0,0,0,0.25)]">
    <div class="container flex items-center justify-between py-3 px-4 sm:py-4">
      <div class="flex items-center gap-2 sm:gap-3">
        <img src="assets/logo-14fly.svg" alt="14FLY" class="brand-logo select-none h-8 sm:h-10" draggable="false" />
        <span class="text-softblue/80 hidden lg:inline text-xs sm:text-sm">Viajar ligero, elegante y humano</span>
      </div>
      <nav class="hidden md:flex items-center gap-2 sm:gap-4 text-softblue text-sm overflow-visible">
        <ng-container *ngIf="auth.isLoggedIn(); else guestLinks">
          <span class="hidden md:inline text-softblue/80 text-xs sm:text-sm">Hola, <span class="text-white">{{ auth.displayName() }}</span></span>
          <a routerLink="/reservas/crear" routerLinkActive="text-accent" class="hover:text-accent whitespace-nowrap flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
            <span>Nueva</span>
          </a>
          <a routerLink="/reservas/mis-reservas" routerLinkActive="text-accent" class="hover:text-accent whitespace-nowrap flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M4.5 6.75A2.25 2.25 0 016.75 4.5h10.5A2.25 2.25 0 0119.5 6.75v10.5A2.25 2.25 0 0117.25 19.5H6.75A2.25 2.25 0 014.5 17.25V6.75z" />
            </svg>
            <span>Mis reservas</span>
          </a>
          <a routerLink="/reservas/historial" routerLinkActive="text-accent" class="hover:text-accent whitespace-nowrap flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
            </svg>
            <span class="hidden sm:inline">Historial</span>
          </a>
          <a routerLink="/me" routerLinkActive="text-accent" class="hover:text-accent whitespace-nowrap hidden sm:inline flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.5 20.25a7.5 7.5 0 0115 0" />
            </svg>
            <span>Perfil</span>
          </a>
          <!-- Admin actions -->
          <ng-container *ngIf="auth.isAdmin()">
            <div class="relative">
              <button type="button" class="hover:text-accent whitespace-nowrap flex items-center gap-1" (click)="toggleAdminMenu()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M12 3l7 4v5c0 5-3.5 8.5-7 9-3.5-.5-7-4-7-9V7l7-4z" />
                </svg>
                <span>Admin ▾</span>
              </button>
              <div *ngIf="adminMenuOpen" class="absolute right-0 top-full mt-2 bg-dark border border-white/10 rounded shadow-xl min-w-60 sm:min-w-64 p-2 z-40">
                <button type="button" (click)="downloadAllReservationsXML(); closeAdminMenu()" class="block w-full text-left px-3 py-2 text-sm rounded hover:bg-white/5">Descargar reservas (XML)</button>
                <button type="button" (click)="openAdminImportModal(); closeAdminMenu()" class="block w-full text-left px-3 py-2 text-sm rounded hover:bg-white/5">Cargar reservas (XML)</button>
                <button type="button" (click)="goToAdminReport(); closeAdminMenu()" class="block w-full text-left px-3 py-2 text-sm rounded hover:bg-white/5">Reportes</button>
              </div>
            </div>
          </ng-container>
          <button type="button" (click)="auth.logout()" class="hover:text-accent whitespace-nowrap flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6A2.25 2.25 0 005.25 5.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M18 12H9m9 0l-3-3m3 3l-3 3" />
            </svg>
            <span>Salir</span>
          </button>
        </ng-container>
        <ng-template #guestLinks>
          <a routerLink="/login" routerLinkActive="text-accent" class="hover:text-accent whitespace-nowrap flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6A2.25 2.25 0 005.25 5.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M18 12H9m9 0l-3-3m3 3l-3 3" />
            </svg>
            <span>Ingresar</span>
          </a>
          <a routerLink="/register" routerLinkActive="text-accent" class="hover:text-accent whitespace-nowrap flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5v9m4.5-4.5h-9M12 5.25a3.75 3.75 0 110 7.5 3.75 3.75 0 010-7.5zM4.5 20.25a7.5 7.5 0 0115 0" />
            </svg>
            <span>Registrarse</span>
          </a>
        </ng-template>
      </nav>
      <button type="button" class="md:hidden inline-flex items-center justify-center p-2 rounded-lg border border-white/10 text-softblue hover:text-accent hover:border-white/20" (click)="toggleMobileMenu()" aria-label="Abrir menú">
        <svg *ngIf="!mobileMenuOpen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
        </svg>
        <svg *ngIf="mobileMenuOpen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <div *ngIf="mobileMenuOpen" class="md:hidden border-t border-white/10 bg-dark/95 backdrop-blur-xl">
      <div class="container px-4 py-3 space-y-2 text-softblue">
        <ng-container *ngIf="auth.isLoggedIn(); else mobileGuestLinks">
          <div class="text-xs text-softblue/80">Hola, <span class="text-white">{{ auth.displayName() }}</span></div>
          <a routerLink="/reservas/crear" routerLinkActive="text-accent" class="block px-3 py-2 rounded-lg hover:bg-white/5 flex items-center gap-2" (click)="closeMobileMenu()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
            <span>Nueva</span>
          </a>
          <a routerLink="/reservas/mis-reservas" routerLinkActive="text-accent" class="block px-3 py-2 rounded-lg hover:bg-white/5 flex items-center gap-2" (click)="closeMobileMenu()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M4.5 6.75A2.25 2.25 0 016.75 4.5h10.5A2.25 2.25 0 0119.5 6.75v10.5A2.25 2.25 0 0117.25 19.5H6.75A2.25 2.25 0 014.5 17.25V6.75z" />
            </svg>
            <span>Mis reservas</span>
          </a>
          <a routerLink="/reservas/historial" routerLinkActive="text-accent" class="block px-3 py-2 rounded-lg hover:bg-white/5 flex items-center gap-2" (click)="closeMobileMenu()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
            </svg>
            <span>Historial</span>
          </a>
          <a routerLink="/me" routerLinkActive="text-accent" class="block px-3 py-2 rounded-lg hover:bg-white/5 flex items-center gap-2" (click)="closeMobileMenu()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.5 20.25a7.5 7.5 0 0115 0" />
            </svg>
            <span>Perfil</span>
          </a>
          <ng-container *ngIf="auth.isAdmin()">
            <div class="mt-2 pt-2 border-t border-white/10 text-xs text-softblue/70">Admin</div>
            <button type="button" (click)="downloadAllReservationsXML(); closeMobileMenu()" class="block w-full text-left px-3 py-2 rounded-lg hover:bg-white/5 flex items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12.75l3 3m0 0l3-3m-3 3V3m13.5 13.5v-6a2.25 2.25 0 00-2.25-2.25h-6" />
              </svg>
              <span>Descargar reservas (XML)</span>
            </button>
            <button type="button" (click)="openAdminImportModal(); closeMobileMenu()" class="block w-full text-left px-3 py-2 rounded-lg hover:bg-white/5 flex items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12.75l3-3m0 0l3 3m-3-3v12m13.5-9v6a2.25 2.25 0 01-2.25 2.25h-6" />
              </svg>
              <span>Cargar reservas (XML)</span>
            </button>
            <button type="button" (click)="goToAdminReport(); closeMobileMenu()" class="block w-full text-left px-3 py-2 rounded-lg hover:bg-white/5 flex items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18h18M7.5 15V9m4.5 6V6m4.5 9v-3" />
              </svg>
              <span>Reportes</span>
            </button>
          </ng-container>
          <button type="button" (click)="auth.logout(); closeMobileMenu()" class="block w-full text-left px-3 py-2 rounded-lg hover:bg-white/5 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6A2.25 2.25 0 005.25 5.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M18 12H9m9 0l-3-3m3 3l-3 3" />
            </svg>
            <span>Salir</span>
          </button>
        </ng-container>
        <ng-template #mobileGuestLinks>
          <a routerLink="/login" routerLinkActive="text-accent" class="block px-3 py-2 rounded-lg hover:bg-white/5 flex items-center gap-2" (click)="closeMobileMenu()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6A2.25 2.25 0 005.25 5.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M18 12H9m9 0l-3-3m3 3l-3 3" />
            </svg>
            <span>Ingresar</span>
          </a>
          <a routerLink="/register" routerLinkActive="text-accent" class="block px-3 py-2 rounded-lg hover:bg-white/5 flex items-center gap-2" (click)="closeMobileMenu()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5v9m4.5-4.5h-9M12 5.25a3.75 3.75 0 110 7.5 3.75 3.75 0 010-7.5zM4.5 20.25a7.5 7.5 0 0115 0" />
            </svg>
            <span>Registrarse</span>
          </a>
        </ng-template>
      </div>
    </div>
  </header>

  <!-- Contenido -->
  <main class="flex-1">
    <div class="container py-6 px-4 sm:py-10 md:py-16">
      <router-outlet />
    </div>
  </main>

  <!-- Footer oscuro con degradado -->
  <footer class="mt-auto bg-gradient-to-br from-dark to-graphite border-t border-white/10 text-softblue">
    <div class="container py-6 sm:py-8 text-center px-4">
      <p class="text-sm sm:text-base">14FLY © 2025</p>
    </div>
  </footer>
</div>

<!-- Backdrop para cerrar menú Admin al hacer click fuera -->
<div *ngIf="adminMenuOpen" class="fixed inset-0 z-10" (click)="closeAdminMenu()"></div>
<div *ngIf="mobileMenuOpen" class="fixed inset-0 z-10 bg-black/40" (click)="closeMobileMenu()"></div>

<!-- Admin Import Modal -->
<app-admin-import-modal
  [open]="showAdminImport"
  [uploading]="uploading"
  [summary]="importSummary"
  (closed)="closeAdminImportModal()"
  (upload)="uploadReservationsXML($event)"
  (viewDiagram)="goToDiagram()"
></app-admin-import-modal>

<!-- Global toasts overlay -->
<app-toast-container />
