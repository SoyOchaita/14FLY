<div class="min-h-screen flex flex-col text-white">
  <!-- Navbar translúcida -->
  <header class="sticky top-0 z-20 bg-dark/80 backdrop-blur-xl border-b border-white/10 shadow-[0_10px_30px_rgba(0,0,0,0.25)]">
    <div class="container flex items-center justify-between py-4">
      <div class="flex items-center gap-3">
        <img src="assets/logo-14fly.svg" alt="14FLY" class="brand-logo select-none" draggable="false" />
        <span class="text-softblue/80 hidden sm:inline">Viajar ligero, elegante y humano</span>
      </div>
      <nav class="flex items-center gap-4 text-softblue">
        <ng-container *ngIf="auth.isLoggedIn(); else guestLinks">
          <span class="hidden sm:inline text-softblue/80">Hola, <span class="text-white">{{ auth.displayName() }}</span></span>
          <a routerLink="/reservas/crear" routerLinkActive="text-accent" class="hover:text-accent">Nueva reserva</a>
          <a routerLink="/reservas/mis-reservas" routerLinkActive="text-accent" class="hover:text-accent">Mis reservas</a>
          <a routerLink="/me" routerLinkActive="text-accent" class="hover:text-accent">Mi perfil</a>
          <!-- Admin actions -->
          <ng-container *ngIf="auth.isAdmin()">
            <div class="relative">
              <button type="button" class="hover:text-accent" (click)="toggleAdminMenu()">Admin ▾</button>
              <div *ngIf="adminMenuOpen" class="absolute right-0 mt-2 bg-dark border border-white/10 rounded shadow-xl min-w-64 p-2 z-30">
                <button type="button" (click)="downloadAllReservationsXML(); closeAdminMenu()" class="block w-full text-left px-3 py-2 rounded hover:bg-white/5">Descargar reservas (XML)</button>
                <button type="button" (click)="openAdminImportModal(); closeAdminMenu()" class="block w-full text-left px-3 py-2 rounded hover:bg-white/5">Cargar reservas (XML)</button>
                <button type="button" (click)="goToAdminReport(); closeAdminMenu()" class="block w-full text-left px-3 py-2 rounded hover:bg-white/5">Reportes</button>
              </div>
            </div>
          </ng-container>
          <button type="button" (click)="auth.logout()" class="hover:text-accent">Cerrar sesión</button>
        </ng-container>
        <ng-template #guestLinks>
          <a routerLink="/login" routerLinkActive="text-accent" class="hover:text-accent">Ingresar</a>
          <a routerLink="/register" routerLinkActive="text-accent" class="hover:text-accent">Registrarse</a>
        </ng-template>
      </nav>
    </div>
  </header>

  <!-- Contenido -->
  <main class="flex-1">
    <div class="container py-10 sm:py-16">
      <router-outlet />
    </div>
  </main>

  <!-- Footer oscuro con degradado -->
  <footer class="mt-auto bg-gradient-to-br from-dark to-graphite border-t border-white/10 text-softblue">
    <div class="container py-8 text-center">
      14FLY © 2025</div>
  </footer>
</div>

<!-- Backdrop para cerrar menú Admin al hacer click fuera -->
<div *ngIf="adminMenuOpen" class="fixed inset-0 z-10" (click)="closeAdminMenu()"></div>

<!-- Admin Import Modal -->
<app-admin-import-modal
  [open]="showAdminImport"
  [uploading]="uploading"
  [summary]="importSummary"
  (closed)="closeAdminImportModal()"
  (upload)="uploadReservationsXML($event)"
  (viewDiagram)="goToDiagram()"
></app-admin-import-modal>

<!-- Global toasts overlay -->
<app-toast-container />
