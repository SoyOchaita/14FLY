<div class="fixed top-24 right-4 z-50 space-y-3 w-80">
  <div *ngFor="let t of toasts" class="px-4 py-3 rounded-xl shadow-lg border flex items-start gap-3"
       [ngClass]="{
         'bg-green-500/20 border-green-400/40 text-green-200': t.type==='success',
         'bg-red-500/20 border-red-400/40 text-red-200': t.type==='error',
         'bg-yellow-500/20 border-yellow-400/40 text-yellow-200': t.type==='warning',
         'bg-softblue/20 border-softblue/40 text-softblue': t.type==='info'
       }">
    <div class="text-xl leading-none select-none">{{ iconFor(t) }}</div>
    <div class="flex-1 text-sm">{{ t.message }}</div>
    <button type="button" class="opacity-70 hover:opacity-100" (click)="dismiss(t.id)">✕</button>
  </div>
</div>
